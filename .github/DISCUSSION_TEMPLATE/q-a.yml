title: '[help] '
body:
- type: markdown
  attributes:
    value: 'English or Korean is preferred; other languages are welcome. / 영어나 한국어를 권장하지만 다른 언어도 괜찮아요.


      **Read first / 먼저 읽어주세요**: [Issue guide / 이슈 작성 가이드](https://github.com/jongwooish/claude-squeeze/blob/main/.github/ISSUE_GUIDE.md)


      '
- type: input
  id: version
  attributes:
    label: squeeze version and OS / squeeze 버전과 운영체제
    placeholder: squeeze 0.1.0, macOS 15
  validations:
    required: true
- type: textarea
  id: question
  attributes:
    label: Your question / 질문 내용
  validations:
    required: true
