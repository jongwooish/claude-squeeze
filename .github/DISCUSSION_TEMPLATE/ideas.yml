title: '[roadmap] '
body:
- type: markdown
  attributes:
    value: 'English or Korean is preferred; other languages are welcome. / 영어나 한국어를 권장하지만 다른 언어도 괜찮아요.


      **Read first / 먼저 읽어주세요**: [Issue guide / 이슈 작성 가이드](https://github.com/jongwooish/claude-squeeze/blob/main/.github/issue-guide/ISSUE_GUIDE.md)


      '
- type: dropdown
  id: topic
  attributes:
    label: Topic / 주제
    options:
    - v0.2 squeeze-Auditor
    - "v0.3: browser and mobile / 브라우저와 모바일"
    - What v1.0 should include / v1.0에 들어갈 것
    - A new idea / 새 아이디어
  validations:
    required: true
- type: textarea
  id: idea
  attributes:
    label: Your thoughts / 의견
  validations:
    required: true
