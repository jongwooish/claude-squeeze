name: Bug report / 버그 신고
description: squeeze crashed, printed something wrong, or broke a session / squeeze 오류, 잘못된 출력, 세션 문제
title: '[bug] '
labels:
- bug
body:
- type: markdown
  attributes:
    value: 'English or Korean is preferred; other languages are welcome. / 영어나 한국어를 권장하지만 다른 언어도 괜찮아요.


      **Read first / 먼저 읽어주세요**: [Issue guide / 이슈 작성 가이드](https://github.com/jongwooish/claude-squeeze/blob/main/.github/issue-guide/ISSUE_GUIDE.md)


      '
- type: input
  id: version
  attributes:
    label: squeeze version / squeeze 버전
    placeholder: squeeze 0.1.0
    description: '`squeeze version`'
  validations:
    required: true
- type: dropdown
  id: os
  attributes:
    label: Operating system / 운영체제
    options:
    - macOS (Apple Silicon)
    - macOS (Intel)
    - Linux (x86_64)
    - Linux (ARM64)
    - Windows (x86_64)
    - Windows (ARM64)
    - Other / 기타
  validations:
    required: true
- type: input
  id: shell
  attributes:
    label: Shell and Claude Code version / 셸과 Claude Code 버전
    placeholder: bash 5.2, Claude Code 2.x / Git Bash, WSL, PowerShell
- type: dropdown
  id: area
  attributes:
    label: Which part? / 어느 부분?
    options:
    - squeeze run / compress
    - Bash guard (hook pre-bash)
    - Read guard (hook pre-read)
    - squeeze init / uninstall
    - squeeze clip
    - squeeze report
    - Installer (install.sh / install.ps1)
    - Other / 기타
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce / 재현 방법
    placeholder: '1. squeeze init

      2. ...

      3. ...'
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected result / 기대한 결과
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: What happened / 실제 결과
    render: text
  validations:
    required: true
- type: textarea
  id: config
  attributes:
    label: .squeeze/config.json (if changed) / .squeeze/config.json (바꿨다면)
    render: json
