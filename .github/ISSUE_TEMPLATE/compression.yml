name: Compression problem / 압축 문제
description: A line was dropped, too much was kept, or a command was (not) caught / 중요한 줄 누락, 절약 부족, 명령 오탐·미탐
title: '[compression] '
labels:
- bug
body:
- type: markdown
  attributes:
    value: 'English or Korean is preferred; other languages are welcome. / 영어나 한국어를 권장하지만 다른 언어도 괜찮아요.


      **Read first / 먼저 읽어주세요**: [Issue guide / 이슈 작성 가이드](https://github.com/jongwooish/claude-squeeze/blob/main/.github/issue-guide/ISSUE_GUIDE.md)


      '
- type: dropdown
  id: kind
  attributes:
    label: What went wrong? / 무엇이 문제였나요?
    options:
    - An important line was dropped / 중요한 줄이 빠짐
    - Too much was kept / 너무 많이 남음
    - A noisy command was NOT redirected / 시끄러운 명령이 안 잡힘
    - A command was redirected but should not be / 잡히면 안 되는 명령이 잡힘
    - Read guard problem / Read 가드 문제
  validations:
    required: true
- type: input
  id: command
  attributes:
    label: The command / 명령어
    placeholder: npm run build -- --verbose
  validations:
    required: true
- type: textarea
  id: missing
  attributes:
    label: Line(s) that should have been kept / 남았어야 할 줄
    render: text
- type: textarea
  id: log
  attributes:
    label: Sample of the original output / 원본 출력 일부
    description: Attach long logs as a file. It may become a test fixture. / 긴 로그는 파일로 첨부. 테스트 로그로 쓰일 수 있음.
    render: text
- type: input
  id: version
  attributes:
    label: squeeze version and OS / squeeze 버전과 운영체제
    placeholder: squeeze 0.1.0, Ubuntu 24.04
  validations:
    required: true
