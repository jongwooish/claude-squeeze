name: Install / update / version problem / 설치·업데이트·버전 문제
description: Installer failed, a release file is missing, or an update broke something / 설치 실패, 릴리스 파일 누락, 업데이트 후 문제
title: '[version] '
labels:
- bug
body:
- type: markdown
  attributes:
    value: 'English or Korean is preferred; other languages are welcome. / 영어나 한국어를 권장하지만 다른 언어도 괜찮아요.


      **Read first / 먼저 읽어주세요**: [Issue guide / 이슈 작성 가이드](https://github.com/jongwooish/claude-squeeze/blob/main/.github/ISSUE_GUIDE.md)


      '
- type: dropdown
  id: kind
  attributes:
    label: What kind of problem? / 어떤 문제인가요?
    options:
    - Installer failed / 설치 스크립트 실패
    - Release file missing or checksum mismatch / 릴리스 파일 없음 또는 체크섬 불일치
    - Broke after updating / 업데이트 후 고장
    - Old settings or hooks stopped working / 이전 설정·훅이 동작 안 함
    - cargo install failed / cargo install 실패
    - Other / 기타
  validations:
    required: true
- type: input
  id: from
  attributes:
    label: Version before / 이전 버전
    placeholder: squeeze 0.1.0
- type: input
  id: to
  attributes:
    label: Version now / 현재 버전
    placeholder: squeeze 0.2.0
  validations:
    required: true
- type: dropdown
  id: method
  attributes:
    label: How did you install it? / 설치 방법
    options:
    - install.sh (macOS / Linux)
    - install.ps1 (Windows)
    - cargo install --git
    - Downloaded a release file / 릴리스 파일 직접 다운로드
    - Built from a clone / 직접 빌드
  validations:
    required: true
- type: input
  id: os
  attributes:
    label: OS and CPU / 운영체제와 CPU
    placeholder: Windows 11 x64
  validations:
    required: true
- type: textarea
  id: output
  attributes:
    label: Full error or output / 전체 오류 또는 출력
    render: text
  validations:
    required: true
