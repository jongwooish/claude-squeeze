name: Feature idea / 기능 제안
description: Suggest a feature or a change, including what v1.0 should have / 새 기능·변경 제안 (v1.0에 바라는 점 포함)
title: '[idea] '
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: 'English or Korean is preferred; other languages are welcome. / 영어나 한국어를 권장하지만 다른 언어도 괜찮아요.


      **Read first / 먼저 읽어주세요**: [Issue guide / 이슈 작성 가이드](https://github.com/jongwooish/claude-squeeze/blob/main/.github/ISSUE_GUIDE.md)


      '
- type: textarea
  id: problem
  attributes:
    label: What problem does this solve? / 어떤 문제를 해결하나요?
  validations:
    required: true
- type: textarea
  id: idea
  attributes:
    label: What should squeeze do? / squeeze가 무엇을 하면 좋을까요?
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Workarounds you tried / 시도해본 다른 방법
- type: checkboxes
  id: help
  attributes:
    label: Contributing / 기여
    options:
    - label: I would like to help build this / 직접 만드는 데 참여하고 싶어요
