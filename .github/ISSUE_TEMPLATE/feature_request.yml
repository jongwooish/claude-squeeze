name: Feature idea / 기능 제안
description: Suggest a feature or a change, including what v1.0 should have / 새 기능·변경 제안 (v1.0에 바라는 점 포함) / 機能や変更の提案（v1.0 への要望も） / 建议新功能或改动（含对 v1.0 的期望） / Propón una función o cambio (también para la v1.0) / Proposez une fonctionnalité ou un changement (y compris pour la v1.0)
title: '[idea] '
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: 'You can write in any of the six languages. / 6개 언어 중 아무 언어로나 쓰세요. / 6 言語のどれでも書けます。 / 六种语言任选。 / Puedes escribir en cualquiera de los seis idiomas. / Écrivez dans l''une des six langues.


      '
- type: textarea
  id: problem
  attributes:
    label: What problem does this solve? / 어떤 문제를 해결하나요? / どんな問題を解決しますか? / 解决什么问题？ / ¿Qué problema resuelve? / Quel problème cela résout-il ?
  validations:
    required: true
- type: textarea
  id: idea
  attributes:
    label: What should squeeze do? / squeeze가 무엇을 하면 좋을까요? / squeeze に何をしてほしいですか? / 希望 squeeze 做什么？ / ¿Qué debería hacer squeeze? / Que devrait faire squeeze ?
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Workarounds you tried / 시도해본 다른 방법 / 試した回避策 / 尝试过的替代方案 / Alternativas que probaste / Solutions de contournement essayées
- type: checkboxes
  id: help
  attributes:
    label: Contributing / 기여 / 貢献 / 参与 / Contribuir / Contribuer
    options:
    - label: I would like to help build this / 직접 만드는 데 참여하고 싶어요 / 実装を手伝いたい / 我愿意参与实现 / Me gustaría ayudar a construirlo / J'aimerais aider à le construire
