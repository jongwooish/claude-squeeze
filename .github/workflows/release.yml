name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, archive: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, archive: tar.gz, cross: true }
          - { target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl') && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          name=squeeze-${{ matrix.target }}
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp target/${{ matrix.target }}/release/squeeze.exe .
            7z a dist/$name.zip squeeze.exe LICENSE README.md
          else
            cp target/${{ matrix.target }}/release/squeeze .
            tar czf dist/$name.tar.gz squeeze LICENSE README.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - name: Release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0 ~ "^## \\[?v?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME — Sentinel" \
            --notes-file notes.md
