name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path CARGO/Cargo.toml --check
      - run: cargo clippy --manifest-path CARGO/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path CARGO/Cargo.toml
      - name: Bench (fixture replay)
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --manifest-path CARGO/Cargo.toml --release -- bench V0.1-Sentinel/v0.1_squeeze-sentinel/testdata/fixtures
