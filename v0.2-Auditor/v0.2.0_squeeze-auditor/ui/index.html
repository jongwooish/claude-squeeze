<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>squeeze-Auditor</title>
<style>
:root {
  --paper: #EEF3EC; --sheet: #F7FAF5; --rule: #C9D8C5; --rule-strong: #9FB69A;
  --ink: #1D2B3A; --ink-soft: #5A6B7A; --stamp: #B8322C; --action: #2F5D8A;
  --action-ink: #FFFFFF; --ok: #2E6B3F; --warn-bg: #FBEFD9; --warn-ink: #7A4B05;
  --serif: "Charter", "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #141A17; --sheet: #1A221E; --rule: #2B3631; --rule-strong: #43544B;
    --ink: #E3EBE4; --ink-soft: #9AAAA0; --stamp: #E0675F; --action: #7FB0DD;
    --action-ink: #0F1A24; --ok: #7CC492; --warn-bg: #3A2E16; --warn-ink: #F2CF8B;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font: 15px/1.5 var(--sans); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--action); }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
nav.rail { border-right: 1px solid var(--rule); padding: 20px 14px; display: flex; flex-direction: column; gap: 2px; background: var(--sheet); }
.brand { font: 600 19px/1.2 var(--serif); padding: 0 10px 18px; }
.brand small { display: block; font: 12px/1.4 var(--sans); color: var(--ink-soft); margin-top: 4px; }
.rail button { text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 6px; cursor: pointer; color: var(--ink-soft); }
.rail button[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: inset 3px 0 0 var(--action); font-weight: 600; }
.rail button:hover { color: var(--ink); }
.rail .spacer { flex: 1; }
.rail .foot { font-size: 12px; color: var(--ink-soft); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.rail .foot select { padding: 4px 6px; border: 1px solid var(--rule); border-radius: 5px; background: var(--paper); }

main { padding: 28px clamp(16px, 4vw, 48px) 60px; max-width: 1100px; width: 100%; }
h1 { font: 600 28px/1.15 var(--serif); margin: 0 0 6px; letter-spacing: -0.01em; }
h2 { font: 600 19px/1.3 var(--serif); margin: 34px 0 10px; }
.lead { color: var(--ink-soft); margin: 0 0 22px; max-width: 70ch; }
.muted { color: var(--ink-soft); }
.small { font-size: 13px; }

/* the audit statement */
.statement { border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule-strong); margin: 8px 0 6px; }
.statement .line { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 16px; padding: 14px 2px; border-bottom: 1px solid var(--rule); }
.statement .line:last-child { border-bottom: 0; }
.statement .what { max-width: 60ch; }
.statement .what b { display: block; font-weight: 600; }
.statement .what span { color: var(--ink-soft); font-size: 13px; }
.statement .fig { font: 600 34px/1 var(--serif); white-space: nowrap; }
.statement .fig small { font: 14px var(--sans); color: var(--ink-soft); margin-left: 6px; }
.statement .kept .fig { color: var(--stamp); }
.stamp { display: inline-block; border: 2px solid var(--stamp); color: var(--stamp); border-radius: 4px; padding: 0 7px; font: 700 12px/1.6 var(--sans); transform: rotate(-3deg); margin-left: 10px; vertical-align: middle; }

.range { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 6px; overflow: hidden; }
.range button { background: none; border: 0; padding: 5px 12px; cursor: pointer; color: var(--ink-soft); }
.range button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 6px; }

.chart { width: 100%; height: auto; aspect-ratio: 900 / 220; min-height: 150px; display: block; }
.chart .bar { fill: var(--action); opacity: .75; }
.chart .bar:hover { opacity: 1; }
.chart .saved { fill: var(--stamp); }
.chart .axis { stroke: var(--rule-strong); }
.chart text { fill: var(--ink-soft); font: 11px var(--sans); }
.legend { display: flex; gap: 18px; font-size: 13px; color: var(--ink-soft); margin: 4px 0 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; font-size: 13px; color: var(--ink-soft); border-bottom: 1px solid var(--rule-strong); }
td.num, th.num { text-align: right; white-space: nowrap; }
tr.off td { color: var(--ink-soft); }
td.kind { white-space: nowrap; }
.path { word-break: break-all; }
.meter { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; min-width: 90px; }
.meter b { display: block; height: 100%; background: var(--action); }
.meter b.over { background: var(--stamp); }

.btn { border: 1px solid var(--rule-strong); background: var(--sheet); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.btn:hover { border-color: var(--ink-soft); }
.btn.primary { background: var(--action); border-color: var(--action); color: var(--action-ink); }
.btn.danger { color: var(--stamp); }
.btn[disabled] { opacity: .55; cursor: default; }

.notice { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 14px 16px; margin: 0 0 20px; }
.notice .actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.ok { color: var(--ok); font-weight: 600; }
.badge-off { color: var(--ink-soft); }
.tips { padding-left: 18px; margin: 6px 0; }
.tips li { margin: 6px 0; max-width: 80ch; }

/* profiles */
.profiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0; border-top: 2px solid var(--ink); }
.profile { padding: 16px 14px 18px; border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); }
.profile:last-child { border-right: 0; }
.profile h3 { font: 600 18px/1.2 var(--serif); margin: 0 0 6px; }
.profile p { margin: 0 0 12px; color: var(--ink-soft); font-size: 14px; min-height: 3em; }
.profile dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; margin: 0 0 14px; }
.profile dt { color: var(--ink-soft); }
.profile dd { margin: 0; text-align: right; }
.profile.current { background: var(--sheet); box-shadow: inset 0 3px 0 var(--action); }

/* settings form */
fieldset { border: 0; border-top: 1px solid var(--rule-strong); padding: 14px 0 6px; margin: 0 0 10px; }
legend { font: 600 17px/1.3 var(--serif); padding: 0 8px 0 0; }
.field { display: grid; grid-template-columns: minmax(180px, 280px) 1fr; gap: 6px 18px; align-items: center; padding: 8px 0; }
.field label { font-weight: 500; }
.field .help { grid-column: 2; color: var(--ink-soft); font-size: 13px; margin-top: -2px; }
.field input[type=number] { width: 140px; padding: 6px 8px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--sheet); }
.field select, textarea { padding: 6px 8px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--sheet); }
textarea { width: 100%; min-height: 72px; resize: vertical; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--action); }
.savebar { position: sticky; bottom: 0; background: var(--paper); border-top: 1px solid var(--rule-strong); padding: 12px 0; display: flex; gap: 12px; align-items: center; }

pre.note { white-space: pre-wrap; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; font: 13px/1.55 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; max-height: 60vh; overflow: auto; }
.cols { display: grid; grid-template-columns: minmax(240px, 1fr) 2fr; gap: 24px; }
.list button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 10px 4px; cursor: pointer; }
.list button[aria-current="true"] { background: var(--sheet); box-shadow: inset 3px 0 0 var(--action); }
.conn { border-top: 2px solid var(--ink); }
.conn section { padding: 18px 2px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; }
.conn h3 { font: 600 18px var(--serif); margin: 0; }
.conn p { margin: 4px 0 0; color: var(--ink-soft); max-width: 70ch; }
.conn .full { grid-column: 1 / -1; }

.toast { position: fixed; bottom: 18px; right: 18px; background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 8px; max-width: 420px; opacity: 0; transform: translateY(8px); transition: opacity .18s, transform .18s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
.toast.err { background: var(--stamp); color: #fff; }
.empty { padding: 26px 4px; color: var(--ink-soft); border-bottom: 1px solid var(--rule); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  nav.rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 10px; }
  .brand, .rail .spacer, .rail .foot { display: none; }
  .rail button { white-space: nowrap; }
  .field { grid-template-columns: 1fr; }
  .field .help { grid-column: 1; }
  .cols { grid-template-columns: 1fr; }
  .statement .fig { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>

<div class="app">

    <button role="tab" data-tab="profiles" data-i18n="tab.profiles"></button>
    <button role="tab" data-tab="settings" data-i18n="tab.settings"></button>
    <button role="tab" data-tab="fixed" data-i18n="tab.fixed"></button>
    <button role="tab" data-tab="handoffs" data-i18n="tab.handoffs"></button>
    <button role="tab" data-tab="connections" data-i18n="tab.connections"></button>
    <div class="spacer"></div>
    <div class="foot">
      <label><span data-i18n="lang"></span>
        <select id="lang"><option value="en">English</option><option value="ko">한국어</option></select>
      </label>
      <span data-i18n="local"></span>
    </div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

let lang = "en";
try { lang = localStorage.getItem("squeeze-lang") || (navigator.language || "").slice(0, 2); } catch (e) { lang = (navigator.language || "").slice(0, 2); }
if (!I18N[lang]) lang = "en";
const t = (k, vars) => { let s = (I18N[lang][k] ?? I18N.en[k] ?? k); for (const [a, b] of Object.entries(vars || {})) s = s.replaceAll("{" + a + "}", b); return s; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString(lang === "ko" ? "ko-KR" : "en-US");
const short = (n) => { n = Number(n || 0); if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M"; if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "K"; return String(n); };
const ago = (ts) => { const s = Date.now() / 1000 - ts; if (s < 90) return t("ago.now"); if (s < 3600) return t("ago.m", { n: Math.round(s / 60) }); if (s < 86400) return t("ago.h", { n: Math.round(s / 3600) }); return t("ago.d", { n: Math.round(s / 86400) }); };
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString(lang === "ko" ? "ko-KR" : [], { hour: "2-digit", minute: "2-digit" });

async function api(path, body) {
  const opts = { headers: { "X-Squeeze-Token": TOKEN } };
  if (body !== undefined) { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({ error: "bad response" }));
  if (!r.ok || (j && j.error)) throw new Error((j && j.error) || r.statusText);
  return j;
}
function toast(msg, err) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.className = "toast show" + (err ? " err" : "");
  clearTimeout(toast.h); toast.h = setTimeout(() => { el.className = "toast"; }, err ? 6000 : 3200);
}
const fail = (e) => toast(t("err") + e.message, true);

const main = document.getElementById("main");
let state = { tab: "dashboard", days: 7, root: "", note: "" };
try { const s = JSON.parse(localStorage.getItem("squeeze-ui") || "{}"); Object.assign(state, s); } catch (e) {}
function remember() { try { localStorage.setItem("squeeze-ui", JSON.stringify({ tab: state.tab, days: state.days, root: state.root })); } catch (e) {} }

function applyI18n() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.getElementById("lang").value = lang;
}
document.getElementById("lang").addEventListener("change", (e) => {
  lang = e.target.value; try { localStorage.setItem("squeeze-lang", lang); } catch (x) {}
  applyI18n(); show(state.tab);
});
document.querySelectorAll(".rail button[data-tab]").forEach((b) => b.addEventListener("click", () => show(b.dataset.tab)));

function show(tab) {
  if (dirty && state.tab === "settings" && tab !== "settings" && !confirmLeave()) return;
  state.tab = tab; remember();
  document.querySelectorAll(".rail button[data-tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab ? "true" : "false"));
  main.innerHTML = "";
  ({ dashboard, profiles, settings, fixed, handoffs, connections }[tab] || dashboard)().catch(fail);
}
let dirty = false;
function confirmLeave() { dirty = false; return true; }

/* ---------- dashboard ---------- */
function dayKey(ts) { const d = new Date(ts * 1000); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function chart(o, days) {
  const now = Date.now() / 1000, buckets = [];
  for (let i = days - 1; i >= 0; i--) buckets.push({ key: dayKey(now - i * 86400), used: 0, saved: 0 });
  const idx = Object.fromEntries(buckets.map((b, i) => [b.key, i]));
  for (const h of o.hourly) { const i = idx[dayKey(h.t)]; if (i !== undefined) buckets[i].used += h.total; }
  for (const h of o.saved_hourly) { const i = idx[dayKey(h.t)]; if (i !== undefined) buckets[i].saved += h.saved; }
  if (days === 1) { // hourly for today
    buckets.length = 0;
    const start = new Date(); start.setHours(0, 0, 0, 0); const s0 = start.getTime() / 1000;
    for (let i = 0; i < 24; i++) buckets.push({ key: String(i).padStart(2, "0"), used: 0, saved: 0 });
    for (const h of o.hourly) if (h.t >= s0) buckets[new Date(h.t * 1000).getHours()].used += h.total;
    for (const h of o.saved_hourly) if (h.t >= s0) buckets[new Date(h.t * 1000).getHours()].saved += h.saved;
  }
  const W = 900, H = 220, P = 34, n = buckets.length, bw = (W - P - 6) / n;
  const max = Math.max(1, ...buckets.map((b) => b.used + b.saved));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("dash.daily"))}">`;
  for (const f of [0, .5, 1]) { const y = H - 22 - f * (H - 40); s += `<line class="axis" x1="${P}" x2="${W}" y1="${y}" y2="${y}" stroke-dasharray="${f ? "2 4" : ""}"/><text x="0" y="${y + 4}">${short(max * f)}</text>`; }
  buckets.forEach((b, i) => {
    const x = P + 3 + i * bw, uh = (b.used / max) * (H - 40), sh = (b.saved / max) * (H - 40), y = H - 22 - uh;
    s += `<rect class="bar" x="${x}" y="${y}" width="${Math.max(1, bw - 3)}" height="${uh}"><title>${esc(b.key)} · ${fmt(b.used)} ${esc(t("leg.used"))}</title></rect>`;
    if (b.saved > 0) s += `<rect class="saved" x="${x}" y="${y - sh}" width="${Math.max(1, bw - 3)}" height="${Math.max(2, sh)}"><title>${esc(b.key)} · ${fmt(b.saved)} ${esc(t("leg.saved"))}</title></rect>`;
    const every = Math.ceil(n / 10);
    if (i % every === 0) s += `<text x="${x}" y="${H - 6}">${esc(days === 1 ? b.key + ":00" : b.key.slice(5))}</text>`;
  });
  return s + "</svg>" + `<div class="legend"><span><i style="background:var(--action);opacity:.75"></i>${esc(t("leg.used"))}</span><span><i style="background:var(--stamp)"></i>${esc(t("leg.saved"))}</span></div>`;
}

async function dashboard() {
  main.innerHTML = `<h1>${esc(t("dash.title"))}</h1><p class="lead">${esc(t("dash.lead"))}</p><div id="welcome"></div><div id="dash" class="muted">…</div>`;
  const [o, env] = await Promise.all([api("/api/overview?days=" + state.days), api("/api/env")]);
  if (!env.claude_code_hooks && !env.desktop_connected) {
    document.getElementById("welcome").innerHTML = `<div class="notice"><b>${esc(t("welcome.title"))}</b><div>${esc(t("welcome.body"))}</div><div class="actions"><button class="btn primary" id="w-cc">${esc(t("welcome.cc"))}</button>${env.desktop_available ? `<button class="btn" id="w-desk">${esc(t("welcome.desk"))}</button>` : ""}</div></div>`;
    document.getElementById("w-cc").onclick = () => api("/api/env", { target: "claude_code", connect: true }).then(() => { toast(t("con.connected")); dashboard(); }).catch(fail);
    const wd = document.getElementById("w-desk"); if (wd) wd.onclick = () => api("/api/env", { target: "desktop", connect: true }).then(() => { toast(t("fix.restart.desk")); dashboard(); }).catch(fail);
  }
  const range = [1, 7, 30].map((d) => `<button aria-pressed="${state.days === d}" data-days="${d}">${esc(t("range." + d))}</button>`).join("");
  const kinds = Object.entries(o.saved.by_kind).sort((a, b) => b[1].tokens - a[1].tokens);
  const blockRows = kinds.length ? kinds.map(([k, v]) => `<tr><td>${esc(t("kind." + k))}</td><td class="num">${fmt(v.events)}</td><td class="num">${fmt(v.tokens)}</td></tr>`).join("") : `<tr><td colspan="3" class="empty">${esc(t("empty.saved"))}</td></tr>`;
  let budget = 150000; try { budget = (await api("/api/settings")).config.budget.tokens; } catch (e) {}
  const sessRows = o.sessions.map((s) => { const pct = Math.min(100, (s.context / budget) * 100); return `<tr><td class="path">${esc(s.path)}<div class="small muted">${esc(s.id)}</div></td><td class="num">${esc(ago(s.last))}</td><td class="num">${fmt(s.context)}<div class="meter" title="${Math.round(pct)}% of budget"><b class="${s.context >= budget ? "over" : ""}" style="width:${pct}%"></b></div></td></tr>`; }).join("");
  const projRows = o.projects.map((p) => `<tr><td class="path">${esc(p.path)}</td><td class="num">${fmt(p.sessions)}</td><td class="num">${esc(ago(p.last))}</td><td class="num">${fmt(p.total)}</td></tr>`).join("");
  const topRows = o.saved.top.map((e) => `<tr><td>${esc(t("kind." + e.kind))}<div class="small muted path">${esc(e.subject)}</div></td><td class="num">${esc(ago(e.ts))}</td><td class="num">${fmt(e.tokens)}</td></tr>`).join("");
  const b = o.block;
  document.getElementById("dash").outerHTML = `
    <div class="toolbar"><div class="range" role="group">${range}</div></div>
    <div class="statement">
      <div class="line"><div class="what"><b>${esc(t("dash.used"))}</b><span>${esc(t("dash.used.sub"))}</span></div><div class="fig">${fmt(o.usage.total)}<small>${esc(t("col.tokens"))}</small></div></div>
      <div class="line kept"><div class="what"><b>${esc(t("dash.kept"))}<span class="stamp">${esc(t("dash.stamp"))}</span></b><span>${esc(t("dash.kept.sub"))}</span></div><div class="fig">${fmt(o.saved.tokens)}<small>${esc(t("col.tokens"))}</small></div></div>
    </div>
    ${o.transcripts_found ? "" : `<p class="empty">${esc(t("empty.transcripts"))}</p>`}
    <h2>${esc(t("dash.daily"))}</h2>${chart(o, state.days)}
    <h2>${esc(t("dash.window"))}</h2>
    <p>${b ? esc(t("dash.window.line", { t: fmt(b.total), n: fmt(b.messages), s: clock(b.start), e: clock(b.end), r: fmt(b.per_minute_last_hour) })) : esc(t("dash.window.none"))}</p>
    <h2>${esc(t("dash.blocks"))}</h2>
    <table><thead><tr><th>${esc(t("col.kind"))}</th><th class="num">${esc(t("col.events"))}</th><th class="num">${esc(t("col.tokens"))}</th></tr></thead><tbody>${blockRows}</tbody></table>
    ${sessRows ? `<h2>${esc(t("dash.sessions"))}</h2><table><thead><tr><th>${esc(t("col.project"))}</th><th class="num">${esc(t("col.last"))}</th><th class="num">${esc(t("col.context"))}</th></tr></thead><tbody>${sessRows}</tbody></table>` : ""}
    ${topRows ? `<h2>${esc(t("dash.top"))}</h2><table><thead><tr><th>${esc(t("col.what"))}</th><th class="num">${esc(t("col.when"))}</th><th class="num">${esc(t("col.tokens"))}</th></tr></thead><tbody>${topRows}</tbody></table>` : ""}
    ${projRows ? `<h2>${esc(t("dash.projects"))}</h2><table><thead><tr><th>${esc(t("col.project"))}</th><th class="num">${esc(t("col.sessions"))}</th><th class="num">${esc(t("col.last"))}</th><th class="num">${esc(t("col.tokens"))}</th></tr></thead><tbody>${projRows}</tbody></table>` : ""}`;
  main.querySelectorAll("[data-days]").forEach((x) => x.onclick = () => { state.days = Number(x.dataset.days); remember(); dashboard().catch(fail); });
}

      ${F("extra_noisy", "set.noisy", `<textarea id="extra_noisy">${esc(c.extra_noisy.join("\n"))}</textarea>`, "set.noisy.h")}
    </fieldset>
    <fieldset><legend>${esc(t("set.files"))}</legend>
      ${F("guard_read", "set.guard_read", sw("guard_read", c.guard_read))}
      ${F("read_max_lines", "set.read_max", num("read_max_lines", c.read_max_lines), "set.read_max.h")}
      ${F("dup_read", "set.dup", sw("dup_read", c.dup_read), "set.dup.h")}
    </fieldset>
    <fieldset><legend>${esc(t("set.session"))}</legend>
      ${F("budget_on", "set.budget_on", sw("budget_on", c.budget.enabled))}
      ${F("budget_tokens", "set.budget", num("budget_tokens", c.budget.tokens, 1000), "set.budget.h")}
      ${F("handoff_on", "set.handoff_on", sw("handoff_on", c.handoff.enabled))}
      ${F("handoff_mode", "set.handoff_mode", `<select id="handoff_mode"><option value="note" ${c.handoff.mode === "note" ? "selected" : ""}>${esc(t("set.mode.note"))}</option><option value="remind" ${c.handoff.mode === "remind" ? "selected" : ""}>${esc(t("set.mode.remind"))}</option></select>`)}
      ${F("handoff_tokens", "set.handoff", num("handoff_tokens", c.handoff.tokens, 1000), "set.handoff.h")}
      ${F("max_age", "set.age", num("max_age", c.handoff.max_age_hours), "set.age.h")}
    </fieldset>
    <fieldset><legend>${esc(t("set.fixed"))}</legend>
      ${F("prune_on", "set.prune", sw("prune_on", c.mcp_prune.enabled), "set.prune.h")}
      ${F("unused_days", "set.days", num("unused_days", c.mcp_prune.unused_days), "set.days.h")}
    </fieldset>
    <div class="savebar"><button class="btn primary" type="submit">${esc(t("set.save"))}</button><span id="dirty" class="small muted"></span></div>
  </form>`;
  const f = document.getElementById("f"); dirty = false;
  f.addEventListener("input", () => { dirty = true; document.getElementById("dirty").textContent = t("set.unsaved"); });
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const v = (id) => document.getElementById(id), n = (id) => Math.max(1, parseInt(v(id).value, 10) || 1), lines = (id) => v(id).value.split("\n").map((x) => x.trim()).filter(Boolean);
    const config = {
      guard_bash: v("guard_bash").checked, guard_read: v("guard_read").checked, read_max_lines: n("read_max_lines"), dup_read: v("dup_read").checked,
      quiet: lines("quiet"), extra_noisy: lines("extra_noisy"),
      compress: { max_lines: n("max_lines"), max_bytes: n("max_bytes"), head_lines: n("head_lines"), tail_lines: n("tail_lines"), context: n("context") },
      budget: { enabled: v("budget_on").checked, tokens: n("budget_tokens") },
      handoff: { enabled: v("handoff_on").checked, mode: v("handoff_mode").value, tokens: n("handoff_tokens"), max_age_hours: n("max_age") },
      mcp_prune: { enabled: v("prune_on").checked, unused_days: n("unused_days") },
    };
    api("/api/settings", { config, custom: true }).then(() => { dirty = false; document.getElementById("dirty").textContent = ""; toast(t("set.saved")); }).catch(fail);
  });
}

/* ---------- fixed cost ---------- */
async function fixed() {
  const projects = await api("/api/projects");
  if (!state.root && projects.length) state.root = projects[0].root;
  const opts = projects.map((p) => `<option value="${esc(p.root)}" ${p.root === state.root ? "selected" : ""}>Claude Code · ${esc(p.path)}</option>`).join("") + `<option value="desktop" ${state.root === "desktop" ? "selected" : ""}>${esc(t("fix.desktop"))}</option>`;
  main.innerHTML = `<h1>${esc(t("fix.title"))}</h1><p class="lead">${esc(t("fix.lead"))}</p>
    <div class="toolbar"><label>${esc(t("fix.target"))} <select id="target" style="max-width:100%">${opts}</select></label></div><div id="report" class="muted">…</div>`;
  document.getElementById("target").onchange = (e) => { state.root = e.target.value; remember(); fixed().catch(fail); };
  const desk = state.root === "desktop";
  const r = await api(desk ? "/api/doctor?target=desktop" : "/api/doctor?root=" + encodeURIComponent(state.root || ""));
  const rows = r.items.map((i) => {
    let act = "";
    if (i.kind === "mcp") {
      act = `<button class="btn" data-measure="${esc(i.id)}" ${i.enabled ? "" : "disabled"}>${esc(t("fix.measure"))}</button> ` +
        `<button class="btn ${i.enabled ? "danger" : ""}" data-toggle="${esc(i.id)}" data-on="${i.enabled ? "0" : "1"}">${esc(t(i.enabled ? "fix.off" : "fix.on"))}</button>`;
    }
    return `<tr class="${i.enabled ? "" : "off"}"><td class="kind">${esc(t("k." + i.kind))}</td><td><b>${esc(i.name)}</b><div class="small muted path">${esc(i.path)}</div>${i.note ? `<div class="small muted">${esc(i.note)}</div>` : ""}</td><td class="num">${i.kind === "mcp" && !i.measured && i.enabled ? "?" : fmt(i.tokens)}</td><td class="num">${act}</td></tr>`;
  }).join("");
  document.getElementById("report").outerHTML = `
    <div class="statement"><div class="line"><div class="what"><b>${esc(t("fix.total"))}</b><span>${esc(r.target)}</span></div><div class="fig">${fmt(r.total_tokens)}<small>${esc(t("col.tokens"))}</small></div></div></div>
    <table><thead><tr><th>${esc(t("col.kind"))}</th><th>${esc(t("col.what"))}</th><th class="num">${esc(t("col.tokens"))}</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="4" class="empty">—</td></tr>`}</tbody></table>
    <p class="small muted">${esc(t("fix.note.measure"))}</p>
    ${r.tips.length ? `<h2>${esc(t("fix.tips"))}</h2><ul class="tips">${r.tips.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}`;
  const root = desk ? "" : state.root;
  main.querySelectorAll("[data-measure]").forEach((b) => b.onclick = () => { b.disabled = true; b.textContent = t("fix.measuring"); api("/api/mcp/measure", { id: b.dataset.measure, root }).then((m) => { if (m.error) toast(m.error, true); fixed().catch(fail); }).catch((e) => { fail(e); fixed(); }); });
  main.querySelectorAll("[data-toggle]").forEach((b) => b.onclick = () => api("/api/mcp/toggle", { id: b.dataset.toggle, root, enabled: b.dataset.on === "1" }).then(() => { toast(t(desk ? "fix.restart.desk" : "fix.restart.cc")); fixed().catch(fail); }).catch(fail));
}

/* ---------- handoffs ---------- */
async function handoffs() {
  const list = await api("/api/handoffs");
  main.innerHTML = `<h1>${esc(t("ho.title"))}</h1><p class="lead">${esc(t("ho.lead"))}</p>` + (list.length ? `<div class="cols"><div class="list" id="hl">${list.map((n) => `<button data-path="${esc(n.path)}" aria-current="${n.path === state.note}"><b>${esc(n.name)}</b><div class="small muted">${esc(n.where)} · ${fmt(Math.ceil(n.bytes / 4))} ${esc(t("col.tokens"))}</div></button>`).join("")}</div><div id="hv"><p class="muted">${esc(t("ho.pick"))}</p></div></div>` : `<p class="empty">${esc(t("ho.empty"))}</p>`);
  const open = (p) => api("/api/handoff?path=" + encodeURIComponent(p)).then((r) => { state.note = p; main.querySelectorAll("#hl button").forEach((b) => b.setAttribute("aria-current", b.dataset.path === p)); document.getElementById("hv").innerHTML = `<pre class="note">${esc(r.text)}</pre>`; }).catch(fail);
  main.querySelectorAll("#hl button").forEach((b) => b.onclick = () => open(b.dataset.path));
  if (list.length) open(list.some((n) => n.path === state.note) ? state.note : list[0].path);
}

/* ---------- connections ---------- */
async function connections() {
  const e = await api("/api/env");
  const ccStatus = e.claude_code_hooks ? (e.claude_code_complete ? `<span class="ok">${esc(t("con.connected"))}</span>` : `<span>${esc(t("con.partial"))}</span>`) : `<span class="badge-off">${esc(t("con.not"))}</span>`;
  const ccBtns = e.claude_code_hooks ? `${e.claude_code_complete ? "" : `<button class="btn primary" data-env="claude_code" data-c="1">${esc(t("con.reconnect"))}</button> `}<button class="btn" data-env="claude_code" data-c="0">${esc(t("con.disconnect"))}</button>` : `<button class="btn primary" data-env="claude_code" data-c="1">${esc(t("con.connect"))}</button>`;
  let desk;
  if (!e.desktop_available) desk = `<section><div><h3>${esc(t("con.desk"))}</h3><p>${esc(t("con.desk.na"))}</p></div></section>`;
  else desk = `<section><div><h3>${esc(t("con.desk"))}</h3><p>${esc(t("con.desk.d", { p: e.desktop_config }))}</p><p>${e.desktop_connected ? `<span class="ok">${esc(t("con.connected"))}</span>` : `<span class="badge-off">${esc(t("con.not"))}</span>`}</p></div>
      <div>${e.desktop_connected ? `<button class="btn" data-env="desktop" data-c="0">${esc(t("con.disconnect"))}</button>` : `<button class="btn primary" data-env="desktop" data-c="1">${esc(t("con.connect"))}</button>`}</div>
      <div class="full"><label for="dirs"><b>${esc(t("con.dirs"))}</b></label><div class="small muted">${esc(t("con.dirs.h"))}</div><textarea id="dirs" placeholder="${navigator.platform.startsWith("Win") ? "C:\\logs" : "/var/log/myapp"}">${esc(e.allowed_dirs.join("\n"))}</textarea><div style="margin-top:8px"><button class="btn" id="savedirs">${esc(t("con.dirs.save"))}</button></div></div></section>`;
  main.innerHTML = `<h1>${esc(t("con.title"))}</h1><p class="lead">${esc(t("con.lead"))}</p><div class="conn">
    <section><div><h3>${esc(t("con.cc"))}</h3><p>${esc(t("con.cc.d", { p: e.settings_path }))}</p><p>${ccStatus}</p></div><div>${ccBtns}</div></section>
    ${desk}
    <section><div><h3>${esc(t("con.prog"))}</h3><p class="path">${esc(e.exe)} · v${esc(e.version)}</p></div></section></div>`;
  main.querySelectorAll("[data-env]").forEach((b) => b.onclick = () => api("/api/env", { target: b.dataset.env, connect: b.dataset.c === "1" }).then(() => { toast(b.dataset.env === "desktop" ? t("fix.restart.desk") : t("fix.restart.cc")); connections().catch(fail); }).catch(fail));
  const sd = document.getElementById("savedirs");
  if (sd) sd.onclick = () => api("/api/allowed", { dirs: document.getElementById("dirs").value.split("\n").map((x) => x.trim()).filter(Boolean) }).then(() => toast(t("con.dirs.saved"))).catch(fail);
}

/* ---------- start ---------- */
applyI18n();
show(state.tab);
const beat = () => api("/api/heartbeat", {}).catch(() => {});
beat(); setInterval(beat, 10000);
</script>
</body>
</html>
