[package]
name = "squeeze"
version = "0.2.0"
edition = "2021"
workspace = "../../CARGO"
rust-version = "1.80"
description = "Keep long command output, repeated reads, oversized sessions and idle MCP servers out of Claude's context"
license = "MIT"
repository = "https://github.com/jongwooish/claude-squeeze"
readme = "README.md"
keywords = ["claude", "claude-code", "tokens", "cli", "hooks"]
categories = ["command-line-utilities", "development-tools"]
default-run = "squeeze"

[lib]
name = "squeeze"
path = "src/lib.rs"

[[bin]]
name = "squeeze"
path = "src/main.rs"

[[bin]]
name = "squeeze-auditor"
path = "src/bin/squeeze-auditor.rs"

[dependencies]
